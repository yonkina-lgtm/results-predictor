<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadPredictor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar panel">
        <div class="brand" aria-label="LeadPredictor brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>LeadPredictor</h1>
        </div>

        <div class="field-group">
          <label for="language" data-i18n="label_language">Language</label>
          <select id="language" class="select-box">
            <option value="en" data-flag="🇺🇸">English</option>
            <option value="es" data-flag="🇪🇸">Español</option>
            <option value="fr" data-flag="🇫🇷">Français</option>
            <option value="de" data-flag="🇩🇪">Deutsch</option>
          </select>
        </div>

        <div class="field-group">
          <label for="currency" data-i18n="label_currency">Currency</label>
          <select id="currency" class="select-box">
            <option value="USD" data-symbol="$">US Dollar</option>
            <option value="EUR" data-symbol="€">Euro</option>
            <option value="GBP" data-symbol="£">British Pound</option>
            <option value="JPY" data-symbol="¥">Japanese Yen</option>
          </select>
        </div>

        <div class="field-group">
          <label for="campaign-start" data-i18n="label_campaign_start">Campaign Start</label>
          <input type="date" id="campaign-start" class="date-box" value="2026-05-08" />
        </div>

        <div class="field-group">
          <label for="campaign-end" data-i18n="label_campaign_end">Campaign End</label>
          <input type="date" id="campaign-end" class="date-box" value="2026-11-04" />
        </div>

        <div class="field-group field-inline">
          <label for="total-revenue" data-i18n="label_total_revenue">Total Revenue</label>
          <div class="number-box" id="total-revenue-box">
            <span class="symbol">$</span>
            <input type="number" id="total-revenue" value="10000" min="0" />
          </div>
        </div>

        <div class="field-group field-inline">
          <label for="avg-order-value" data-i18n="label_avg_order_value">Avg. Order Value</label>
          <div class="number-box" id="avg-order-value-box">
            <span class="symbol">$</span>
            <input type="number" id="avg-order-value" value="1000" min="0" />
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <section class="chart-and-stats">
          <div class="chart-panel panel">
            <div class="chart-area">
              <div class="y-axis">
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
                <span>6</span>
              </div>

              <div class="bars-wrapper">
                <div class="bar-stack stack-1" data-month="1" aria-label="Month 1">
                  <span class="bar segment segment-prospects"></span>
                  <span class="bar segment segment-leads"></span>
                  <span class="bar segment segment-customers"></span>
                </div>
                <div class="bar-stack stack-2" data-month="2" aria-label="Month 2">
                  <span class="bar segment segment-prospects"></span>
                  <span class="bar segment segment-leads"></span>
                  <span class="bar segment segment-customers"></span>
                </div>
                <div class="bar-stack stack-3" data-month="3" aria-label="Month 3">
                  <span class="bar segment segment-prospects"></span>
                  <span class="bar segment segment-leads"></span>
                  <span class="bar segment segment-customers"></span>
                </div>
                <div class="bar-stack stack-4" data-month="4" aria-label="Month 4">
                  <span class="bar segment segment-prospects"></span>
                  <span class="bar segment segment-leads"></span>
                  <span class="bar segment segment-customers"></span>
                </div>
                <div class="bar-stack stack-5" data-month="5" aria-label="Month 5">
                  <span class="bar segment segment-prospects"></span>
                  <span class="bar segment segment-leads"></span>
                  <span class="bar segment segment-customers"></span>
                </div>
                <div class="bar-stack stack-6" data-month="6" aria-label="Month 6">
                  <span class="bar segment segment-prospects"></span>
                  <span class="bar segment segment-leads"></span>
                  <span class="bar segment segment-customers"></span>
                </div>
              </div>

              <div class="chart-legend">
                <span>0 people</span>
                <span>10 people</span>
                <span>20 people</span>
                <span>40 people</span>
                <span>60 people</span>
                <span>80 people</span>
                <span>100 people</span>
                <span>120 people</span>
              </div>
            </div>
          </div>

          <div class="stats-column">
            <div class="metric-card panel">
              <div class="metric-header">
                <span class="metric-icon metric-icon--prospects" aria-hidden="true"></span>
                <span data-i18n="label_prospects">Prospects</span>
                <span class="metric-percent">100%</span>
              </div>
              <div class="metric-value">125</div>
              <div class="metric-bar"><span style="width: 100%"></span></div>
            </div>

            <div class="metric-card panel">
              <div class="metric-header">
                <span class="metric-icon metric-icon--leads" aria-hidden="true"></span>
                <span data-i18n="label_leads">Leads</span>
                <span class="metric-percent">20%</span>
              </div>
              <div class="metric-value">25</div>
              <div class="metric-bar"><span style="width: 20%"></span></div>
            </div>

            <div class="metric-card panel">
              <div class="metric-header">
                <span class="metric-icon metric-icon--customers" aria-hidden="true"></span>
                <span data-i18n="label_customers">Customers</span>
                <span class="metric-percent">8%</span>
              </div>
              <div class="metric-value">10</div>
              <div class="metric-bar"><span style="width: 8%"></span></div>
            </div>
          </div>
        </section>

        <section class="sliders panel">
          <div class="slider-row">
            <label for="lead-rate" data-i18n="label_lead_response_rate">Lead Response Rate</label>
            <div class="range-wrap">
              <input id="lead-rate" type="range" min="0" max="100" value="40" />
              <span class="range-value">40.00%</span>
            </div>
          </div>

          <div class="slider-row">
            <label for="prospect-rate" data-i18n="label_prospect_response_rate">Prospect Response Rate</label>
            <div class="range-wrap">
              <input id="prospect-rate" type="range" min="0" max="100" value="20" />
              <span class="range-value">20.00%</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
